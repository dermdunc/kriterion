# --- Inference ------------------------------------------------------------

[[evidence]]
id = "ev-440"
category = "INFERENCE"
attestation = "AUTHORED"
claim = "Inferred from ev-422, ev-423 and ev-430: a substantial part of Northstar's 6-week onboarding time is plausibly attributable to toolchain fragmentation rather than to domain learning. This is an inference from co-occurrence; nothing in the scenario separates the two causes, and a platform that removes the fragmentation would not shorten the domain-learning part at all."
source = "Derived within the case from the scenario baseline; not independently evidenced"
period = "scenario baseline"
strength = "LOW"

[[evidence]]
id = "ev-441"
category = "INFERENCE"
attestation = "AUTHORED"
claim = "Inferred from ev-425 and ev-426: a component-owning team structure and a high recurring-request rate are mutually consistent with support demand being structural -- an artefact of how ownership is drawn -- rather than a staffing shortfall. If so, adding platform capacity without changing the ownership model raises throughput on the queue without shortening it."
source = "Derived within the case; ev-418 supplies the mechanism, nothing in the scenario measures it"
period = "scenario baseline"
strength = "LOW"

[[evidence]]
id = "ev-442"
category = "INFERENCE"
attestation = "AUTHORED"
claim = "Inferred from ev-414 and ev-437: buying a commercial platform substitutes for the portal and catalogue layer, which is not where Northstar's cost sits, and does not substitute for the integration to Northstar's own provisioning, policy and deployment systems, which is. The build-versus-buy choice therefore decides less of the total effort than it appears to."
source = "Derived within the case from one REAL item and one synthetic scenario judgment"
period = "scenario baseline"
strength = "MEDIUM"

[[evidence]]
id = "ev-443"
category = "INFERENCE"
attestation = "AUTHORED"
claim = "Inferred from ev-402, ev-411, ev-412 and ev-413: the public evidence on AI-assisted engineering currently points in both directions, with individual task speed-ups, a team-level throughput decrease, and a measured gap between perceived and actual speed-up all reported. The case therefore cannot ground either AI hypothesis -- that agents raise or that they lower the value of platform abstractions -- and treating either as settled would be unsupported."
source = "Derived within the case from four REAL items that disagree"
period = "2023-2025"
strength = "MEDIUM"

[[evidence]]
id = "ev-444"
category = "INFERENCE"
attestation = "AUTHORED"
claim = "Inferred from ev-428 and ev-429: the golden-path delivery advantage at Northstar is confounded by selection. Golden-path teams are concentrated in the newest part of the estate, so the observed 2-day versus 9-day gap is an upper bound on what a platform could deliver to the rest, and possibly a large overstatement of it."
source = "Derived within the case; the confound is stated in ev-428's own scenario definition"
period = "scenario baseline"
strength = "MEDIUM"

