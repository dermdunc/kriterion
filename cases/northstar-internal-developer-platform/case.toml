# Kriterion Human Run 001 -- Northstar Software Group, Internal Developer Platform.
#
# AUTHORED_FIXTURE. Northstar Software Group is FICTIONAL. It is not a real
# company, it is not a pseudonym for a real company, and no number attributed to
# it below is an observation of any real organisation.
#
# Two attestation values are used here, and the distinction is load-bearing:
#
#   attestation = "REAL"      the claim is drawn from a real, named, public
#                             source that a reader can go and check. Used only
#                             on EXTERNAL_REFERENCE items.
#
#   attestation = "AUTHORED"  the claim is a synthetic scenario input invented
#                             for this experiment. EVERY Northstar-specific
#                             fact carries this value, including the ones whose
#                             EvidenceCategory is MEASURED. `MEASURED` there
#                             describes what KIND of claim it would be inside
#                             the scenario -- telemetry rather than opinion --
#                             not that anyone measured anything. ADR-003 makes
#                             these two axes orthogonal precisely so a fixture
#                             can simulate a measurement without claiming one.
#
# The generated decision page renders the attestation badge beside every item,
# so a reader sees REAL or AUTHORED on each claim rather than having to trust
# this header.
#
# Provenance ceiling, stated up front: the REAL items cite public work by
# title, author and publishing organisation. They were checked against the
# published sources at freeze time, but the case pack carries no URLs, and no
# claim below should be treated as stronger than the source it names. Where a
# source is analyst commentary or vendor material rather than primary research,
# the item says so in its own `source` field and its strength is set
# accordingly.
#
# Economics: kriterion.economics.case_flows.compute_staged_platform_economics.
# Every number the model spends comes from this pack's own [[assumptions]].

[case]
id = "northstar-internal-developer-platform"
title = "Northstar Software Group -- Internal Developer Platform investment (FICTIONAL SCENARIO)"
sponsor = "CTO"
decision_owner = "cto"
decision_requested = "Should Northstar Software Group invest approximately GBP3m-GBP5m over the next 18 months in an Internal Developer Platform, or pursue a lower-cost programme of incremental improvements to its existing engineering toolchain?"
alternatives = [
    "do_nothing",
    "optimise_existing_toolchain",
    "buy_commercial_platform",
    "build_thin_internal_platform",
    "build_strategic_idp",
    "staged_hybrid",
]
strategic_objectives = [
    "Reduce the time a new engineer needs before they can independently ship a change to production",
    "Reduce the engineering effort Northstar spends on repetitive platform onboarding, configuration and support",
    "Make security and operational controls consistent across business units without adding approval queues",
    "Establish whether reduced developer friction produces attributable business value before committing to enterprise scale",
    "Keep the option open to route engineering work through AI coding agents without rebuilding the platform to do it",
]
deadline = "2027-06-30"

[case.ask]
type = "capital_investment"
amount_gbp = 4_000_000
duration = "18 months"
# SYNTHETIC. The midpoint of the scenario's stated GBP3m-GBP5m envelope.
# `Ask.amount_gbp` is a single required float, so the range itself cannot be
# expressed here; the staging ladder the case actually argues for is carried by
# as-precommitted-capital-gbp and by ev-450. Recorded as a product limitation,
# not worked around.

# --- External reference: public research --------------------------------
# Real, checkable, public sources. attestation = "REAL".

[[evidence]]
id = "ev-401"
category = "EXTERNAL_REFERENCE"
attestation = "REAL"
claim = "The four DORA delivery metrics -- deployment frequency, lead time for changes, change failure rate and time to restore service -- are reported as statistically predictive of organisational performance, establishing that software delivery performance is measurable and consequential rather than merely a matter of engineering taste."
source = "Forsgren, Humble & Kim, 'Accelerate: The Science of Lean Software and DevOps' (IT Revolution, 2018); DORA / Google Cloud, Accelerate State of DevOps Report series"
period = "2018 onward"
strength = "HIGH"

[[evidence]]
id = "ev-402"
category = "EXTERNAL_REFERENCE"
attestation = "REAL"
claim = "DORA's 2024 State of DevOps research reports that increased AI adoption was associated with a decrease in delivery throughput and in delivery stability, i.e. the productivity gain individual developers perceive did not appear in team-level delivery outcomes."
source = "DORA / Google Cloud, Accelerate State of DevOps Report 2024"
period = "2024"
strength = "MEDIUM"
contradicts = ["ev-413"]

[[evidence]]
id = "ev-403"
category = "EXTERNAL_REFERENCE"
attestation = "REAL"
claim = "The SPACE framework argues that developer productivity is multidimensional (satisfaction, performance, activity, communication, efficiency) and that no single metric -- including any activity count or time saved -- validly represents it; measuring one dimension alone reliably produces misleading conclusions."
source = "Forsgren, Storey, Maddila, Zimmermann, Houck & Butler, 'The SPACE of Developer Productivity', ACM Queue, 2021"
period = "2021"
strength = "HIGH"
contradicts = ["ev-444"]

[[evidence]]
id = "ev-404"
category = "EXTERNAL_REFERENCE"
attestation = "REAL"
claim = "Developer experience is characterised along three dimensions -- feedback loops, cognitive load and flow state -- and friction in any of them degrades output. This gives platform investment a mechanism of action beyond raw tool consolidation."
source = "Noda, Storey, Forsgren & Greiler, 'DevEx: What Actually Drives Productivity', ACM Queue, 2023"
period = "2023"
strength = "HIGH"

[[evidence]]
id = "ev-405"
category = "EXTERNAL_REFERENCE"
attestation = "REAL"
claim = "A platform should be treated as a product with its own users, roadmap and adoption problem, and should be the 'thinnest viable platform' that removes cognitive load -- explicitly warning against platforms that expand to abstract every engineering workflow."
source = "Skelton & Pais, 'Team Topologies' (IT Revolution, 2019)"
period = "2019"
strength = "HIGH"
supports = ["ev-434"]

[[evidence]]
id = "ev-406"
category = "EXTERNAL_REFERENCE"
attestation = "REAL"
claim = "Extraneous cognitive load imposed on stream-aligned teams by infrastructure, tooling and process is a limiting factor on delivery, and reducing it is the stated purpose of a platform team. The load is not eliminated by a platform, only relocated -- to the platform team."
source = "Skelton & Pais, 'Team Topologies' (IT Revolution, 2019)"
period = "2019"
strength = "HIGH"

[[evidence]]
id = "ev-407"
category = "EXTERNAL_REFERENCE"
attestation = "REAL"
claim = "The CNCF Platforms White Paper defines a platform as an internal product providing self-service capabilities over existing infrastructure, and states that platform success is measured by adoption and by the outcomes of its users, not by capability count."
source = "CNCF Platforms Working Group, 'Platforms White Paper' (Cloud Native Computing Foundation)"
period = "2023"
strength = "MEDIUM"

[[evidence]]
id = "ev-408"
category = "EXTERNAL_REFERENCE"
attestation = "REAL"
claim = "The CNCF Platform Engineering Maturity Model describes platform adoption as progressing through identifiable stages and treats measurement, product management and user feedback as maturity dimensions in their own right -- implying that a platform funded as a build project rather than a product is structurally under-resourced."
source = "CNCF Platforms Working Group, 'Platform Engineering Maturity Model' (Cloud Native Computing Foundation)"
period = "2023-2024"
strength = "MEDIUM"

[[evidence]]
id = "ev-409"
category = "EXTERNAL_REFERENCE"
attestation = "REAL"
claim = "Gartner has predicted that by 2026 a large majority of software engineering organisations will have established platform teams as internal providers of reusable services and tools. This is an analyst adoption forecast, not a measurement of outcomes: it says platform teams will be common, not that they will work."
source = "Gartner analyst prediction, widely cited in platform-engineering commentary. ANALYST FORECAST, not primary research"
period = "2023 forecast for 2026"
strength = "LOW"

[[evidence]]
id = "ev-410"
category = "EXTERNAL_REFERENCE"
attestation = "REAL"
claim = "Industry survey work on platform engineering reports that platform adoption is widespread and that organisations self-report benefits in delivery speed and standardisation, while also reporting that platform teams struggle with unclear ownership and with proving value to funders."
source = "Puppet, State of DevOps Report -- Platform Engineering editions. INDUSTRY SURVEY: self-reported, self-selected respondents, no control group"
period = "2023-2024"
strength = "LOW"

[[evidence]]
id = "ev-411"
category = "EXTERNAL_REFERENCE"
attestation = "REAL"
claim = "A controlled experiment on AI coding assistance found treated developers completed a specific, self-contained programming task substantially faster than the control group. The measured task was narrow and greenfield; the study does not measure delivery of changes into an existing production codebase."
source = "Peng, Kalliamvakou, Cihon & Demirer, 'The Impact of AI on Developer Productivity: Evidence from GitHub Copilot' (2023)"
period = "2023"
strength = "MEDIUM"
contradicts = ["ev-412"]

[[evidence]]
id = "ev-412"
category = "EXTERNAL_REFERENCE"
attestation = "REAL"
claim = "A randomised controlled trial with experienced open-source developers working on their own mature repositories found that AI tooling made them SLOWER on real tasks, while the same developers believed it had made them faster. The perception gap is the finding that matters here: self-reported developer time saved is not a reliable measurement of time actually saved."
source = "METR, randomised controlled trial on the effect of AI tools on experienced open-source developer productivity (2025)"
period = "2025"
strength = "MEDIUM"
contradicts = ["ev-411"]

[[evidence]]
id = "ev-413"
category = "EXTERNAL_REFERENCE"
attestation = "REAL"
claim = "An enterprise randomised controlled trial on AI-assisted development reported a measurable reduction in time to complete assigned development tasks in an industrial setting."
source = "Paradis et al., enterprise randomised controlled trial on AI impact on development speed (Google)"
period = "2024-2025"
strength = "MEDIUM"
contradicts = ["ev-402"]

[[evidence]]
id = "ev-414"
category = "EXTERNAL_REFERENCE"
attestation = "REAL"
claim = "Backstage, the developer-portal framework open-sourced by Spotify and donated to the CNCF, is widely adopted as a starting point for internal developer portals. Public practitioner accounts consistently report that the portal itself is the small part of the work and that the plugin, catalogue and ownership-data integration is the large part."
source = "Spotify / CNCF Backstage project, and published practitioner accounts of Backstage adoption"
period = "2020 onward"
strength = "MEDIUM"
supports = ["ev-441"]

[[evidence]]
id = "ev-415"
category = "EXTERNAL_REFERENCE"
attestation = "REAL"
claim = "InnerSource practice identifies the Trusted Committer role as the mechanism that makes cross-team contribution work, and identifies review and acceptance capacity -- not contributor willingness -- as the usual bottleneck. A platform that invites contribution without funding acceptance capacity converts a support queue into a pull-request queue."
source = "InnerSource Commons, InnerSource Patterns ('Trusted Committer' and related patterns)"
period = "ongoing"
strength = "MEDIUM"

[[evidence]]
id = "ev-416"
category = "EXTERNAL_REFERENCE"
attestation = "REAL"
claim = "The 'paved road' pattern -- secure, supported defaults that are the easiest path for a developer to take -- is documented as the practical mechanism by which large engineering organisations achieve consistent security and reliability properties without per-change approval."
source = "Adkins, Beyer, Blankinship, Lewandowski, Oprea & Stubblefield, 'Building Secure and Reliable Systems' (Google / O'Reilly, 2020)"
period = "2020"
strength = "HIGH"
supports = ["ev-434"]

[[evidence]]
id = "ev-417"
category = "EXTERNAL_REFERENCE"
attestation = "REAL"
claim = "Policy-as-code engines (e.g. Open Policy Agent, a CNCF graduated project) provide a documented mechanism for expressing and enforcing controls uniformly across heterogeneous infrastructure, and secure-development frameworks such as NIST SP 800-218 (SSDF) call for controls to be applied consistently and automatically rather than per-project."
source = "CNCF Open Policy Agent project; NIST Special Publication 800-218, Secure Software Development Framework"
period = "2021-2022"
strength = "MEDIUM"

[[evidence]]
id = "ev-418"
category = "EXTERNAL_REFERENCE"
attestation = "REAL"
claim = "Conway's Law: a system's structure tends to mirror the communication structure of the organisation that builds it. Applied here, it predicts that a platform built by a team without authority over the business units' delivery priorities will reproduce, not remove, the existing boundaries."
source = "Melvin E. Conway, 'How Do Committees Invent?', Datamation, 1968"
period = "1968"
strength = "MEDIUM"

[[evidence]]
id = "ev-419"
category = "EXTERNAL_REFERENCE"
attestation = "REAL"
claim = "Published technology-radar and practitioner commentary repeatedly cautions against internal developer platforms built without a product mindset, against platform teams operating as ticket-takers, and against 'overambitious' platforms that attempt to abstract every workflow. The named failure mode is a platform that adds an abstraction layer without removing the underlying complexity."
source = "Thoughtworks Technology Radar entries on platform engineering and internal developer platforms; corroborating practitioner literature"
period = "2020-2024"
strength = "MEDIUM"
contradicts = ["ev-445"]

[[evidence]]
id = "ev-420"
category = "EXTERNAL_REFERENCE"
attestation = "REAL"
claim = "Commercial developer-platform vendors publish ROI models claiming payback within 12 months on developer-productivity grounds alone. Methodologies are typically undisclosed, inputs are vendor-selected, baselines are unstated, and the productivity-to-value conversion is assumed rather than demonstrated."
source = "Commercial internal-developer-platform vendor marketing collateral, category-level characterisation. VENDOR EVIDENCE -- included so that it can be challenged, not relied upon"
period = "2023-2025"
strength = "LOW"
contradicts = ["ev-403", "ev-452"]

