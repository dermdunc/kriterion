[[assumptions]]
id = "as-productivity-uplift"
value = 0.18
range = [0.05, 0.30]
evidence_strength = "MEDIUM"
owner = "cfo"
# Ties to ev-018.

[[assumptions]]
id = "as-fully-loaded-cost-gbp"
value = 120_000
range = [100_000, 140_000]
evidence_strength = "LOW"
owner = "cfo"
# Fully-loaded annual engineer cost used to monetise freed capacity. Not
# directly evidenced in the ledger -- a modelling input, kept explicit and
# low-strength rather than hidden inside a formula.

[[assumptions]]
id = "as-benefit-attribution-factor"
value = 0.10
range = [0.05, 0.20]
evidence_strength = "LOW"
owner = "cfo"
# What fraction of nominal freed-capacity value (uplift x cost x headcount)
# actually converts to a realised benefit, rather than time that is freed
# but never monetised. Exists specifically because ev-024 states no agreed
# benefits-attribution methodology exists -- naive full-salary-equivalent
# monetisation would be exactly the "secretly an ROI calculator" failure
# mode docs/v0-plan.md Section 8 warns against. Range is wide and
# LOW-strength on purpose: this is the case's most contested number.

[[assumptions]]
id = "as-training-cost-per-engineer-gbp"
value = 340
range = [280, 400]
evidence_strength = "MEDIUM"
owner = "cfo"
