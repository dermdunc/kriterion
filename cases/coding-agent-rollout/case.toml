# Case A -- docs/v0-plan.md Section 8. AUTHORED_FIXTURE: every item below is
# fictional, shaped as plausible enterprise evidence for a coding-agent
# rollout decision. Nothing in this file is real company data.

[case]
id = "coding-agent-rollout"
title = "Enterprise coding-agent rollout"
sponsor = "CTO"
decision_owner = "cio"
decision_requested = "Should we fund a staged rollout of an enterprise coding agent to 5,000 engineers?"
alternatives = ["do_nothing", "limited_pilot", "targeted_role_rollout", "enterprise_rollout"]
strategic_objectives = [
    "Reduce engineering cycle time on routine change classes",
    "Retain engineers by removing low-value toil",
    "Build internal capability before a competitor's tooling advantage compounds",
]
deadline = "2026-12-01"

[case.ask]
type = "staged_funding"
amount_gbp = 4_200_000
duration = "24 months"
# Staging, per Section 8: discovery GBP50k -> pilot GBP420k/12wk -> targeted
# scale GBP1.6m -> enterprise. Recorded here as a comment since Ask (Section 4)
# has no stages[] field of its own -- the staging detail is deliberation
# input, not part of the frozen ask's own required fields.

