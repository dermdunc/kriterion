hypothesis: >
  We believe that a structured, evidence-first AI-assisted decision process —
  normalising a technology/AI investment proposal into evidence, assumptions
  and deterministic economics; independent anonymous role assessments;
  structured challenge and premortem; explicit belief updates; a synthetic
  recommendation plus strongest dissent; and an explicit human decision with
  an outcome contract — will measurably improve the quality, challenge,
  traceability and learning of enterprise technology investment decisions
  compared with a strong single-agent baseline given the same evidence and
  deterministic calculations, while keeping accountable humans in control of
  every actual decision. This is not a claim that multi-agent debate is
  inherently superior to a single strong model — that comparison is the
  experiment, not an assumed conclusion, per
  kriterion-private/docs/context/ai-investment-committee-context-pack-2026-09-05.md
  Section 0.
confirmation_criteria:
  - "A weekend-scale V0 runs the full case pipeline end-to-end on at least one of the three required cases (enterprise coding-agent rollout, international platform-engineering investment, invisible AI control-plane investment) and produces a HumanDecision and OutcomeContract artifact, not merely a synthetic recommendation. NOTE (added at codex cross-model critique, 2026-09-05): this deliberately sets a lower minimum bar than the source material's own ideal — the context pack's stated success criteria call for three materially different cases run end-to-end, not one. One case end-to-end is judged sufficient to confirm THIS intent's hypothesis (that the mechanism works and is worth continuing), because the mechanism either functions on a real case or it doesn't; three-case coverage tests generality across case types, which is a stretch goal for the weekend-scale V0, not a minimum confirmation bar. If the eventual Fable/Codex/Opus plan disagrees with that judgment, that disagreement is exactly the kind of divergence this intent's own header flags for a new/amended intent, not silent absorption"
  - "The structured-deliberation treatment is run against at minimum the strong single-agent baseline (Baseline A) on shared case inputs with comparable token/cost budgets, and the comparison is evaluated independently of the model that generated the deliberation, per kriterion-private/docs/context/ai-investment-committee-planning-loop-prompts-2026-09-05.md Section 5 Step H"
  - "At least one belief-update event is recorded end-to-end with initial_position, initial_confidence, new_evidence_or_argument, revised_position, revised_confidence, and stated_reason_for_change all populated and traceable to real evidence, not majority pressure alone"
  - "AMENDED 2026-09-05, see amendments/0001-defer-assurance-capability-evaluation.yaml: Kriterion V0 emits a self-contained, versioned run-export artifact (kriterion-run-export/v0.1 per v0-plan.md ADR-005) capturing everything a future Assurance integration would need, with zero import from or schema dependency on hekton-assurance-lab. Real Assurance evaluation of a Kriterion run as a capability is explicitly deferred past V0 to a future intent, contingent on Assurance itself reaching a state that makes integration safe rather than premature coupling. [ORIGINAL, superseded by the amendment, not deleted: \"Hekton Assurance (or the closest available interface, given it remains an unpromoted lab at declaration time) evaluates at least one run of the committee as a capability, without Kriterion's own domain types (DecisionCase, CommitteePosition, BeliefUpdate, Motion, DecisionRecommendation, OutcomeContract) leaking into Assurance's own generic architecture\"]"
disproof_criteria:
  - "The structured-deliberation treatment does not outperform the strong single-agent baseline by a margin fixed BEFORE the comparison run in the eval plan's pre-registered thresholds (added at codex cross-model critique, 2026-09-05, replacing the original unbounded 'enough... to justify' wording, which was flagged as a judgment call rather than a fixed falsifiable line) — per kriterion-private/docs/context/ai-investment-committee-planning-loop-prompts-2026-09-05.md Section 7's first kill/pivot criterion. If no such pre-registered threshold exists yet when this comparison is run, that absence is itself treated as this criterion firing, not as license to judge post hoc. If this fires, the documented pivot is to simplify toward the independent-panel-no-debate baseline (Baseline B) rather than abandon the product"
  - "Evidence provenance cannot be enforced cleanly — agents are observed silently converting an assumption or forecast into a measured-evidence claim, or fabricating a source, in eval runs designed to test exactly this — per Section 7's second kill/pivot criterion. If this fires, the documented pivot is to tighten the evidence-ledger freeze/version mechanism before any further deliberation-protocol work"
  - "AMENDED 2026-09-05, see amendments/0001-defer-assurance-capability-evaluation.yaml: Kriterion's run-export schema is found, on inspection at any point before a future integration attempt, to already assume or embed Assurance-specific structure (rather than being a self-contained artifact Assurance could consume without change) — meaning the boundary was compromised in advance of the integration this amendment defers, not just left untested. If this fires, the documented pivot is to redesign the export artifact as genuinely generic before any future Assurance work proceeds. [ORIGINAL, superseded by the amendment, not deleted: \"Integrating Hekton Assurance requires Assurance to learn Kriterion-specific domain semantics rather than evaluating it as a generic capability — per Section 7's third kill/pivot criterion and the non-negotiable factory-output boundary in Section 1. If this fires, the documented pivot is to narrow the integration surface, not to let the boundary erode\"]"
  - "The Hekton Local LLM component fails a pre-registered minimum bar — set before the run, not judged after seeing output — for reliably distinguishing evidence categories or producing coherent role assessments (added at codex cross-model critique, 2026-09-05, replacing the original unbounded 'insufficient... credibly' wording) — per Section 7's fourth kill/pivot criterion. If this fires, the documented pivot is to fall back to whatever stronger executor is already available for the initial experiment, deferring Local-LLM-only operation"
